# See dos how to configure the bundle: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # valid drivers options include "gd" or "gmagick" or "imagick"
    driver: "gd"
    
    resolvers:
        default:
            web_path: 
                web_root:  '%kernel.project_dir%/public_html'
                cache_prefix: 'uploads/cache'
                
    loaders:
        default:
            filesystem:
                data_root: "%kernel.project_dir%/public_html/"

    cache:                default
    data_loader:          default
    
    # This is where all the filters sets are located
    filter_sets:
        thumb:
            quality: 75
            filters:
                thumbnail: { size: [150, 150], mode: outbound }
    
        small: # The name of the filter, can be later used in the twig template 
            quality: 75 # Compression quality, this image will be 75% the quality 
            filters: 
                # These are the filters of the filter set, many filters can be applied 
                # Scale and shrink the image to the given size, with a possible crop of the image 
                thumbnail: 
                    size: [300, 300] 
                    mode: outbound 
                    
        wide: 
            quality: 80 
            filters: 
                relative_resize: 
                    size: [640, 480] 
                    mode: outbound 
    
        large:
            filters: 
                thumbnail: 
                    heighten: 480
                    allow_upscale: true
    
        big:
            filters: 
                thumbnail: 
                    heighten: 960
                    allow_upscale: true
