security:
    access_decision_manager:
        strategy: unanimous
        allow_if_all_abstain: false
    encoders:
        App\Entity\User:
            algorithm: auto
            cost: 12
        Symfony\Component\Security\Core\User\User: plaintext
    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]
    providers:
        chain_provider:
            chain:
                providers: [in_memory, user_db_provider]
        in_memory:
            memory:
                users:
                    superadmin:
                        password: 'superadminpw'
                        roles: ['ROLE_SUPER_ADMIN']
        user_db_provider:
            entity:
                class: App\Entity\User
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api_login:
            pattern:  ^/api/v1/token
            user_checker: App\Security\Checker\UserChecker
            stateless: true
            anonymous: true
            json_login:
                provider: chain_provider
                check_path: /api/v1/token
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            provider: user_db_provider
        refresh:
            pattern:  ^/api/v1/token/refresh
            stateless: true
            anonymous: true
        api_register:
            pattern:  ^/api/v1/register
            stateless: true
            anonymous: true
        api:
            pattern: ^/api
            stateless: true
            anonymous: false
            provider: user_db_provider
            guard:
                authenticators:
                    - lexik_jwt_authentication.security.guard.jwt_token_authenticator
        feed:
            pattern:  ^/feed
            stateless: true
            anonymous: true
        sitemap:
            pattern:  ^/sitemap.xml
            stateless: true
            anonymous: true
        main:
            user_checker: App\Security\Checker\UserChecker
            anonymous: true
            logout:
                path: app_logout
            remember_me:
                secret:   '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path:     /
            guard:
                authenticators:
                    - App\Security\LoginFormAuthenticator
                    - App\Security\FacebookAuthenticator
                    - App\Security\GoogleAuthenticator
                    - App\Security\TokenAuthenticator
                entry_point: App\Security\LoginFormAuthenticator
            provider: user_db_provider
    access_control:
        - { path: ^/api/v1/token, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api/v1/register$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        
        - { path: ^/feed, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/sitemap.xml$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        
        - { path: ^/login$,    roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register$, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/forgot$,   roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/reset,     roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/admin,     roles: ROLE_ADMIN }